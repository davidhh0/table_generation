llm_model: Qwen/Qwen3.8-2.4T-A95B
rephrase_model: gpt-5.2-2025-12-11
rephrase: false

# Batch mode: when true, run.py uses the two-pass batch orchestrator
# (collect prompts -> submit one batch per model -> score from cache).
use_batch: true
batch_poll_interval: 30
batch_chunk_size: 80   # submit prompts in batches of this size, caching each chunk before the next

# --- OpenAI output-token / reasoning caps ---------------------------------
# Answers are a single value or a short comma-separated list, so a small output
# budget is plenty. max_completion_tokens caps reasoning + visible output
# together (reasoning models), preventing a hidden reasoning-token bill on
# trivial answers. reasoning_effort is applied only to reasoning models
# (gpt-5*, o-series); gpt-4.1 (title_and_key_model) ignores it.
# max_completion_tokens is a SAFETY CEILING, not the cost lever: for reasoning
# models it counts reasoning + visible output together, so a tight value (e.g.
# 512) gets fully consumed by reasoning and returns EMPTY content
# (finish_reason="length"). Keep it generous; control cost via reasoning_effort.
# Bundled Open-Book prompts scale this up with the number of questions.
max_completion_tokens: 16000
openai_reasoning_effort: low   # minimal | low | medium | high | xhigh

# --- HuggingFace ------------------------------------------------------------
# hf_disable_thinking: try to skip the <think> block on vLLM-served HF models
# (chat_template_kwargs.enable_thinking=False). Only relevant if the model
# actually supports it -- Qwen3.8-2.4T-A95B burned the full max_completion_tokens
# budget (4096, then 16000) on hidden reasoning with zero visible output both
# times, so raising the cap further wasn't converging on an answer.
hf_disable_thinking: true

# hf_ob_disable_thinking: overrides hf_disable_thinking for open-book prompts
# only (both the consolidated bundle call and its per-prompt fallback).
# CB/MC showed no measurable benefit from thinking (they're pure recall/choice,
# nothing to reason over) but OB's aggregation tasks (Count/Max/Min/List) still
# lagged Qwen3.5 by a large, significant margin even after fixing scoring bugs
# and adding consolidation -- e.g. a live Switzerland-demographics case where
# suppressing thinking made the model skip a "row has no value, use the next
# one" check it visibly did when allowed to reason. Unset falls back to
# hf_disable_thinking (no OB-specific behavior). Re-enabling thinking means the
# cap must cover hidden reasoning too, not just the visible answer -- see the
# raised ceilings in _hf_consolidated/_hf_parallel (batch.py).
hf_ob_disable_thinking: false

# hf_chunk_size: prompts per warm_cache chunk for HF models specifically,
# overriding batch_chunk_size (80, tuned for OpenAI/Anthropic/Gemini's batch
# submission overhead). _hf_parallel already writes each answer to the cache as
# soon as it completes (not at chunk end), so a kill mid-run loses at most the
# handful of calls in flight (bounded by hf_max_workers below) regardless of
# this value. Kept small anyway so progress ("chunk N cached") reports more often.
hf_chunk_size: 24

# hf_max_workers: concurrent threads _hf_parallel runs against the HF inference
# endpoint (there's no true batch API, so this is the actual parallelism, not a
# submission-size knob). Higher = faster but more likely to trip provider rate
# limits (general_hf's retry has no backoff, so sustained 429s degrade into a
# slow serial crawl); lower = slower but gentler. 12 was the prior hardcoded value.
hf_max_workers: 4

# --- Anthropic / Claude (e.g. Opus 4.8) -----------------------------------
# max_completion_tokens above also governs the Claude `max_tokens` (visible-output
# ceiling) on both live and batch calls. Extended thinking is OFF by default --
# these answers are a single value or short list, so thinking adds cost/latency
# without benefit (the analog of keeping openai_reasoning_effort low). When on, the
# thinking budget is ADDED on top of the answer budget (Anthropic requires
# max_tokens > budget_tokens). Note: open-book consolidation forces tool-use, which
# Anthropic disallows alongside thinking, so consolidated bundles never use thinking.
claude_extended_thinking: false
claude_thinking_budget: 4096   # budget_tokens when claude_extended_thinking: true

# --- Google / Gemini ------------------------------------------------------
# max_completion_tokens above also governs the Gemini `max_output_tokens` (visible
# output only -- thinking has its own budget, so a generous cap never truncates the
# answer) on both live and batch calls. gemini_thinking_budget is optional: leave
# unset to use the SDK default, set to 0 to disable thinking on 2.5 models, or a
# token count to cap it. Open-book consolidation uses native JSON structured output.
gemini_thinking_budget:   # unset = SDK default; 0 disables thinking; N = budget

# --- Open-Book consolidation (OpenAI + Anthropic + Gemini + HuggingFace) ---
# Bundle all open-book questions for one table into a single call (CSV sent
# once, N requests -> 1), then split answers back to each question's cache key.
# OpenAI uses response_format json_schema; Anthropic uses forced tool-use;
# Gemini uses response_schema; HuggingFace just asks for the same JSON shape
# in-prompt and parses leniently (no schema enforcement on a generic vLLM
# endpoint). Closed-Book/MC are never bundled (would contaminate
# parametric-recall measurement). Set false to disable.
consolidate_open_book: true
open_book_bundle_size: 15   # max questions per consolidated prompt; >this is chunked
title_and_key_model: gpt-4.1-2025-04-14 # gpt-4.1-2025-04-14
context: false
run_tables_to_fetch: 1
# gpt-5.2-2025-12-11
# Minimum table size for a table to be considered valid.
minimum_table_size:
  rows: 8
  columns: 2

minimum_popularity:


maximum_cell_length: 108

special_chars:
  link_char: '∟'
  style_char: '∫'

remove_data_different_style_from_headers: false



# Any rightmost/leftmost column from the following list will be dropped from the table.
drop_columns_blacklist:
  - "Notes"
  - "Reference"
  - "References"
  - "Ref"
  - "Ref."
  - "Note"
  - "Notes"
  - "Remarks"
  - "Remarks/Notes"
  - "Remarks/Note"
  - "Remarks/Ref."
  - "Reference/Note"
  - "No."

# Any cell with the following values will be considered NULL.
null_chars:
  - "—"
  - "-"
  - "none"
  - "–"

# Whether to drop the table if the program finds a column to be removed. (Not including the columns in the `drop_columns_blacklist` list)
drop_table_on_column_removal: false

# Maximum number of NULL values allowed in a single row.
# If a row has more than this number of NULL values, it will be considered invalid and will be dropped.
# Example: A row with 3 NULL values will be considered invalid if this value is set to 2.
maximum_row_null_values:
  type: percent # Can be 'abs' or 'percent'
  value: 0.8 # 3 NULL values in a row.

# Maximum number of NULL values allowed in a single column.
# If a column has more than this number of NULL values, it will be considered invalid and will be dropped.
maximum_column_null_values:
  type: percent # Can be 'abs' or 'percent'
  value: 0.4 # 40% of number of cells in the column.


# If the last row of the table is an aggregation row, it will be dropped.
# This is useful for tables where the last row is a summary or total row.
last_row_agg_mechanism: true

# Whether to allow non-ASCII characters in the table.
only_ascii_chars: false
  

# Known date formats for parsing and storing the original date values.
known_dates_format:
  - "%d %b"      # 7 May
  - "%d %B"      # 7 January (full month)
  - "%d/%m/%Y"   # 07/05/2025
  - "%Y-%m-%d"   # 2025-05-07
  - "%b %d %Y"  # May 7 2025
  - "%d-%m-%Y"   # 07-05-2025
  - "%m/%d/%Y"   # 05/07/2025
  - "%d %b %Y"  # 7 May 2025
  - "%b %Y"  # May 2025
  - "%B %Y"  # June 2025
  - "%B %d %Y"  # June 7 2025
  - "%B %d"  # June 7
  - "%b %d"  # June 7
  - "%d %b %Y"  # 7 May 2025
  - "%d %B %Y"  # 7 May 2025




header_manipulations:
  # Example: https://en.wikipedia.org/wiki/List_of_cities_in_Yamanashi_Prefecture_by_population - Rank (2020) -> Rank
  remove_data_inside_parentheses: true
  # Example: https://en.wikipedia.org/wiki/Latin_American_migration_to_the_United_Kingdom#Official_statistics_on_Latin_American-born_residents - Population (2021/22 census)[14][15][16] -> Population (2021/22 census)
  remove_data_inside_square_brackets: true

cell_manipulations:
  # Example: https://en.wikipedia.org/wiki/2009%E2%80%9310_Biathlon_World_Cup_%E2%80%93_Sprint_Men#Standings - Name column (Emil Hegle Svendsen (NOR) -> Emil Hegle Svendsen)
  remove_data_inside_parentheses: true
  remove_data_inside_square_brackets: true

maximum_mixed_types:
  # Maximum number of mixed types allowed in a single column.
  # If a column has more than this number of mixed types, it will be considered invalid and will be dropped.
  # Example: A column with both numbers and strings will be considered invalid if this value is set to 1.
  type: abs # Can be 'abs' or 'percent'
  value: 3
  # Example for 'abs':
  # type: abs
  # value: 2 # 2 cells in the table.

