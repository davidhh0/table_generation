rephrasing: |
  Transform the structured task below into a single, natural language question.
  The task describes a query on a specific table.
  Your goal is to write a question that sounds natural and implies the context of the table (from the title) without explicitly stating "Assume a table...".
  Guidelines:
  1.  **Context**: Incorporate the table's specific topic (e.g., from the title "1990 Ben Hogan Tour") so the question makes sense on its own.
  2.  **Phrasing**: Convert technical conditions into natural language:
      - "equals 'X'" → "in X", "of X", or "is X"
      - "does not equal 'X'" → "outside of X", "other than X", or "excluding X"
      - "is either 'X' or 'Y'" → "in X or Y"
  3.  **Cleanliness**: Remove technical terms like "rows", "columns", "primary key", or instructions about the output format (e.g., "exact value").
  Task:
  """
  {STRUCTURED_TASK}
  """
  Natural Question:

# == Wrapper templates ==
closed_book_wrapper: |
 Assume a factual table titled '{TABLE_TITLE}' with a primary key column named '{PRIMARY_KEY_COLUMN}':
 {QUESTION}
 {INSTRUCTION}


multiple_choice_wrapper: |
 Assume a factual table titled '{TABLE_TITLE}' with a primary key column named '{PRIMARY_KEY_COLUMN}':
 {QUESTION}
 Select one from the following options: ['{CHOICE_1}', '{CHOICE_2}', '{CHOICE_3}']
 {INSTRUCTION}

list_retrieval_multiple_choices_wrapper: |
 Assume a factual table titled '{TABLE_TITLE}' with a primary key column named '{PRIMARY_KEY_COLUMN}':
 {QUESTION}
 Select all that apply from the following options: {CHOICES_LIST}
 {INSTRUCTION}

open_book_wrapper: |
 Given a factual table titled '{TABLE_TITLE}':
 {FULL_CSV_TABLE}
 Question: {QUESTION}.
 {INSTRUCTION}



# == Instructions ==
single_value_retrieval_instruction: |
 Answer with the exact value only. No sentences or punctuation.

list_value_retrieval_instruction: |
 Return the values as a comma-separated list without any additional text.

multiple_return_retrieval_instruction: |
 Answer with the exact value only. If multiple answers are possible, return only the first one. No sentences or punctuation.



# == Tasks ==

# Single value retrieval and list retrieval
single_value: |
 Identify the value of the column `{DESIRED_COLUMN}` where the `{KEY_COLUMN}` column equals '{KEY_VALUE}'


list_value: |
 List all values in the `{KEY_COLUMN}` column


# Count retrievals
count_rows: |
  Count the number of rows

# Max and Min value retrievals
max_value: |
 Name the `{PRIMARY_COLUMN}` with the highest `{COMPARISON_COLUMN}` column
min_value: |
 Name the `{PRIMARY_COLUMN}` with the lowest `{COMPARISON_COLUMN}` column


# Break-downs
categorical_equals: |
  where the `{DESIRED_COLUMN}` column equals '{DESIRED_VALUE}'
categorical_not_equals: |
  where the `{DESIRED_COLUMN}` column does not equal '{DESIRED_VALUE}'
categorical_in: |
  where the `{DESIRED_COLUMN}` column is either '{CHOICE_1}' or '{CHOICE_2}'

numerical_greater_than: |
  where the `{COMPARISON_COLUMN}` column is greater than {THRESHOLD} inclusive
numerical_less_than: |
  where the `{COMPARISON_COLUMN}` column is less than {THRESHOLD} inclusive
numerical_between: |
  where the `{COMPARISON_COLUMN}` column is between {LOWER_THRESHOLD} and {UPPER_THRESHOLD} inclusive
numerical_equals: |
  where the `{COMPARISON_COLUMN}` column equals {VALUE}
